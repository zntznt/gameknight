    <!--
      Installable as an app. Every path here is relative, so a fork served from
      a repo subpath resolves them as happily as a custom domain does.
      iOS ignores the manifest's icons, hence the separate apple-touch-icon.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gameknight" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every thumbnail and the attribution logo come from here. -->
    <link rel="preconnect" href="https://cf.geekdo-images.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <!--
      With scripting off, the "Loading the shelf" line below would sit there
      forever promising something that is never coming, so hide it and let the
      <noscript> beside it explain instead.
    -->
    <noscript>
      <style>
        .gk-loading--js { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <!--
      The header ends with a strip of one button per surviving game, up to 137 of
      them, so tabbing from the top of the page to the first question meant
      passing every one. Parked off screen until focused.
    -->
    <a class="gk-skip" href="#gkRoot">Skip to the board</a>
    <header class="gk-header">
      <div class="gk-headrow gk-headrow--top">
        <div class="gk-mark" aria-hidden="true">
          <svg viewBox="523.862 373.852 1085.178 1304.128" aria-hidden="true"><path fill="currentColor" d="M 1246.61 373.852 C 1248.66 376.075 1247.52 427.448 1247.51 435.147 L 1247.34 557.761 C 1232.32 568.475 1216.71 577.905 1201.7 588.843 C 1241.88 628.153 1285.32 667.92 1326.35 706.843 L 1609.04 975.031 C 1558.96 1030.1 1507.69 1091.91 1458.28 1148.52 C 1408.47 1101.71 1359.78 1053.26 1309.78 1006.75 C 1258.38 1007.03 1206.99 1007.58 1155.59 1008.41 C 1114.33 973.894 1073.93 937.097 1032.92 902.184 C 1014.69 886.661 996.552 869.772 977.82 854.969 C 993.877 899.678 1004.02 953.516 1021.21 998.454 C 1023.14 1003.49 1043.67 1025.03 1049.11 1031.06 L 1090.88 1077.66 L 1324.83 1337.52 L 1324.88 1503.15 L 1508.23 1502.89 L 1508.36 1677.94 L 989 1677.98 L 523.957 1677.82 L 523.909 1503.26 C 586.039 1502.69 649.5 1503.33 711.72 1503.42 L 711.668 1351.89 L 523.862 1351.53 L 523.931 1088.61 C 568.999 1030.87 613.349 971.197 657.643 912.736 C 696.134 862.371 734.372 811.813 772.355 761.064 C 717.326 801.486 663.941 844.78 609.083 885.515 C 588.978 900.444 567.988 916.244 548.739 932.192 C 571.53 836.746 601.384 761.868 663.675 684.035 C 764.007 557.35 910.689 475.872 1071.26 457.634 C 1052.33 498.814 1027.61 540.536 1008.75 582.069 C 1035.1 561.194 1066.88 531.842 1092.91 509.081 L 1246.61 373.852 z"/></svg>
        </div>
        <div class="gk-wordmark">Gameknight</div>
        <a
          class="gk-bgg"
          href="https://boardgamegeek.com"
          target="_blank"
          rel="noopener"
          title="Powered by BoardGameGeek"
        >
          <!--
            Intrinsic size stated so the 26px-tall box is reserved before a
            single byte arrives; without it the header reflowed when the logo
            landed. Not lazy: it is in the sticky header, on screen from the
            first paint, and lazy only delayed it.
            Do not rewrite the /fit-in/1200x900/ path segment. It carries a
            thumbor signature and any edit returns HTTP 400, which would break
            the attribution image BGG requires.
          -->
          <img
            src="https://cf.geekdo-images.com/HZy35cmzmmyV9BarSuk6ug__imagepagezoom/img/pXXf-xfYw0boHLfc3sL_g1nsLtY=/fit-in/1200x900/filters:no_upscale():strip_icc()/pic7779581.png"
            alt="Powered by BoardGameGeek"
            width="1200"
            height="352"
            decoding="async"
          />
        </a>
        <!--
          Forking? Do not edit this href. Set site.repoUrl in
          data/collections.config.json and the app overrides it at runtime.
          This value is only the fallback used before the first fetch.
        -->
        <a
          class="gk-gh"
          href="https://github.com/zntznt/gameknight"
          target="_blank"
          rel="noopener"
          title="Source on GitHub"
          aria-label="Source on GitHub"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </div>
      <div class="gk-headrow gk-headrow--live" id="gkLive"></div>
      <!--
        The announcement, deliberately NOT on the row above.
        That row is rebuilt in full on every state change and contains a button
        per surviving game, so marking it live meant a screen reader read out the
        entire shelf, by name, every time you touched anything. This node is
        never rebuilt: app.js writes one short sentence into it, and only when
        the number actually changes.
      -->
      <p id="gkLiveMsg" class="gk-sr" aria-live="polite" aria-atomic="true"></p>
    </header>

    <!--
      The loading line is markup, not the first thing render() paints. It is on
      screen before app.js has been fetched or parsed, so a slow module, a failed
      one, or a browser that cannot run it all leave a sentence up rather than
      blank paper. render() replaces the whole root on its first call, so this
      costs nothing once the app is alive.
    -->
    <div id="gkRoot" class="gk-root" tabindex="-1">
      <div class="gk-loading gk-loading--js">Loading the shelf…</div>
      <noscript>
        <div class="gk-loading">
          Gameknight sorts your shelf inside the browser, so it needs JavaScript
          switched on. There is no server doing it for you.
        </div>
      </noscript>
    </div>
    <div id="gkBarRoot"></div>
    <div id="gkSheetRoot"></div>

    <!--
      app.js imports these three, and they import each other, so without this the
      browser cannot even learn they exist until app.js has been fetched and
      parsed, and games.json waits behind all of it. Declaring them here flattens
      that: everything starts at once and the shelf request moves a round trip
      earlier. Relative, like everything else, so a fork on a repo subpath is
      unaffected, and test/sw-shell.test.mjs asserts this list against the real
      module graph so it cannot drift.
    -->
    <link rel="modulepreload" href="./js/data.js" />
    <link rel="modulepreload" href="./js/questions.js" />
    <link rel="modulepreload" href="./js/ranking.js" />
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
